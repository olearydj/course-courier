[project]
name = "course-courier"
version = "0.1.3"
description = "Safely plan allowlisted publication of course content."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupytext>=1.17,<2.0",
    "nbformat>=5.10,<6.0",
    "pyyaml>=6.0,<7.0",
    "typer>=0.12,<1.0",
]

[project.scripts]
course-courier = "course_courier.cli:app"
ccc = "course_courier.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "3 days"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
