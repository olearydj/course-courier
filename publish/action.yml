name: Course Courier publish
description: Publish a previously reviewed Course Courier export with explicit confirmation.
inputs:
  config:
    description: Manifest path relative to the calling course repository.
    required: true
  public_token:
    description: Fine-grained read/write token for the manifest-selected public repository.
    required: true
  expected_manifest_sha256:
    description: Manifest SHA-256 from a reviewed Course Courier inventory.
    required: true
  confirmation:
    description: Literal publish confirmation.
    required: true
outputs:
  published:
    description: Whether this run created and pushed a public-repository commit.
    value: ${{ steps.publish.outputs.published }}
  inventory_path:
    description: Runner path of the verified inventory JSON.
    value: ${{ steps.prepare.outputs.inventory }}
  review_path:
    description: Runner path of the structured pre-publish review JSON.
    value: ${{ steps.prepare.outputs.review }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
    - id: prepare
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
        CONFIRMATION: ${{ inputs.confirmation }}
      run: |
        set -euo pipefail
        test "${CONFIRMATION}" = "publish"
        publish_root="${RUNNER_TEMP}/course-courier-publish"
        stage="${publish_root}/stage"
        inventory="${publish_root}/inventory.json"
        review="${publish_root}/review.json"
        mkdir -p "${publish_root}"
        uv run --locked --project "${GITHUB_ACTION_PATH}/.." ccc build --config "${GITHUB_WORKSPACE}/${CONFIG}" --output "${stage}" > "${inventory}"
        uv run --locked --project "${GITHUB_ACTION_PATH}/.." ccc verify --config "${GITHUB_WORKSPACE}/${CONFIG}" --output "${stage}" > "${publish_root}/verify.json"
        cmp -s "${inventory}" "${publish_root}/verify.json"
        python - "${inventory}" "${EXPECTED_MANIFEST_SHA256}" >> "${GITHUB_OUTPUT}" <<'PY'
        import json
        import sys
        inventory = json.load(open(sys.argv[1]))
        if inventory['manifest_sha256'] != sys.argv[2]:
            raise SystemExit('reviewed manifest SHA-256 does not match the current manifest')
        print(f"repository={inventory['public']['repository']}")
        print(f"branch={inventory['public']['branch']}")
        print(f"managed_subtree={inventory['public']['managed_subtree']}")
        PY
        printf 'inventory=%s\nreview=%s\nstage=%s\n' "${inventory}" "${review}" "${stage}" >> "${GITHUB_OUTPUT}"
    - uses: actions/checkout@v4
      with:
        repository: ${{ steps.prepare.outputs.repository }}
        ref: ${{ steps.prepare.outputs.branch }}
        path: .course-courier-public
        token: ${{ inputs.public_token }}
        persist-credentials: true
    - id: publish
      shell: bash
      run: |
        set -euo pipefail
        public_root="${GITHUB_WORKSPACE}/.course-courier-public"
        managed_subtree="${{ steps.prepare.outputs.managed_subtree }}"
        stage_root="${{ steps.prepare.outputs.stage }}"
        if [ "${managed_subtree}" = "." ]; then
          stage_boundary="${stage_root}"
          public_boundary="${public_root}"
        else
          stage_boundary="${stage_root}/${managed_subtree}"
          public_boundary="${public_root}/${managed_subtree}"
          mkdir -p "${public_boundary}"
        fi
        uv run --locked --project "${GITHUB_ACTION_PATH}/.." python -m course_courier.review --stage "${stage_root}" --public "${public_root}" --managed-subtree "${managed_subtree}" > "${{ steps.prepare.outputs.review }}"
        if [ "$(python -c "import json; print(str(json.load(open('${{ steps.prepare.outputs.review }}'))['changed']).lower())")" = "false" ]; then
          printf 'published=false\n' >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        rsync -a --delete --exclude=.git "${stage_boundary}/" "${public_boundary}/"
        git -C "${public_root}" config user.name "course-courier[bot]"
        git -C "${public_root}" config user.email "course-courier[bot]@users.noreply.github.com"
        git -C "${public_root}" add -A
        git -C "${public_root}" commit -m "Publish course content from ${GITHUB_SHA} (manifest ${{ inputs.expected_manifest_sha256 }})"
        git -C "${public_root}" push origin "HEAD:${{ steps.prepare.outputs.branch }}"
        printf 'published=true\n' >> "${GITHUB_OUTPUT}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: course-courier-publish-review
        path: |
          ${{ steps.prepare.outputs.inventory }}
          ${{ steps.prepare.outputs.review }}
        if-no-files-found: warn
