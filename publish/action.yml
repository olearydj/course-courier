name: Course Courier publish
description: Publish a verified Course Courier export with explicit confirmation.
inputs:
  config:
    description: Manifest path relative to the calling course repository.
    required: true
  public_token:
    description: Fine-grained read/write token for the manifest-selected public repository.
    required: true
  expected_manifest_sha256:
    description: Optional manifest SHA-256 from a reviewed Course Courier inventory.
    required: false
  confirmation:
    description: Literal publish confirmation.
    required: true
outputs:
  published:
    description: Whether this run created and pushed a public-repository commit.
    value: ${{ steps.publish.outputs.published }}
  inventory_path:
    description: Runner path of the verified inventory JSON.
    value: ${{ steps.prepare.outputs.inventory }}
  review_path:
    description: Runner path of the structured pre-publish review JSON.
    value: ${{ steps.prepare.outputs.review }}
  manifest_sha256:
    description: SHA-256 of the manifest used for this publication.
    value: ${{ steps.prepare.outputs.manifest_sha256 }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.5"
    - id: prepare
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        PUBLIC_TOKEN: ${{ inputs.public_token }}
        EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
        CONFIRMATION: ${{ inputs.confirmation }}
      run: bash "${GITHUB_ACTION_PATH}/prepare.sh"
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: ${{ steps.prepare.outputs.repository }}
        ref: ${{ steps.prepare.outputs.branch }}
        path: .course-courier-public
        token: ${{ inputs.public_token }}
        persist-credentials: true
    - id: publish
      shell: bash
      env:
        STAGE: ${{ steps.prepare.outputs.stage }}
        REVIEW: ${{ steps.prepare.outputs.review }}
        MANAGED_SUBTREE: ${{ steps.prepare.outputs.managed_subtree }}
        MANIFEST_SHA256: ${{ steps.prepare.outputs.manifest_sha256 }}
        BRANCH: ${{ steps.prepare.outputs.branch }}
      run: bash "${GITHUB_ACTION_PATH}/publish.sh"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: course-courier-publish-review
        path: |
          ${{ steps.prepare.outputs.inventory }}
          ${{ steps.prepare.outputs.review }}
        if-no-files-found: warn
